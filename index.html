<style>
/* Layout concept: a quiet packing ledger. Sticky header with three tabs; content in one column that opens into a card grid on wide screens.
   Every garment carries a luggage-tag code (T1, P3, F2) so it can be named the same way everywhere. */
:root{
  --bg:#F0F3F4; --surface:#FFFFFF; --surface-2:#E6EBED; --tile:#EBF0F1;
  --ink:#15202A; --ink-2:#4D5C67; --ink-3:#74838E; --line:#D3DADE; --line-2:#E2E7EA;
  --accent:#0D6770; --accent-ink:#FFFFFF; --accent-soft:#D5EBED;
  --warn:#85500A; --warn-soft:#F9EBD2; --ok:#1B7048;
  --glyph-line:rgba(21,32,42,.38);
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1418; --surface:#162026; --surface-2:#1F2B32; --tile:#1D282E;
    --ink:#E6ECEF; --ink-2:#A2B0B9; --ink-3:#778791; --line:#2B3841; --line-2:#222E36;
    --accent:#5CC3CC; --accent-ink:#052428; --accent-soft:#163A3F;
    --warn:#E5B261; --warn-soft:#37290F; --ok:#6DCB98;
    --glyph-line:rgba(230,236,239,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#162026; --surface-2:#1F2B32; --tile:#1D282E;
  --ink:#E6ECEF; --ink-2:#A2B0B9; --ink-3:#778791; --line:#2B3841; --line-2:#222E36;
  --accent:#5CC3CC; --accent-ink:#052428; --accent-soft:#163A3F;
  --warn:#E5B261; --warn-soft:#37290F; --ok:#6DCB98;
  --glyph-line:rgba(230,236,239,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3,p{margin:0}
button,select,input{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font:700 19px/1 var(--f-display);font-stretch:118%;letter-spacing:.01em}
.brand .trip-line{font:500 12px/1.3 var(--f-mono);color:var(--ink-2);letter-spacing:.02em}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);padding:3px;border-radius:9px}
.tabs button{border:0;background:transparent;padding:8px 6px;border-radius:7px;font:600 13px var(--f-body);color:var(--ink-2);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
main{padding-block:20px 56px}

/* type */
.sec-head{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
h2{font:700 24px/1.15 var(--f-display);font-stretch:112%;text-wrap:balance}
h3{font:600 15px/1.3 var(--f-body)}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
section+section{margin-top:28px}
.sub-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sub-head h2{font-size:18px}

/* tag + tile + swatch */
.code{display:inline-flex;align-items:center;font:500 11px/1 var(--f-mono);letter-spacing:.06em;border:1px solid var(--ink-3);color:var(--ink);padding:3px 6px 3px 5px;border-radius:3px}
.code::before{content:"";width:4px;height:4px;border-radius:50%;border:1px solid currentColor;margin-right:5px}
.tile{position:relative;display:grid;place-items:center;width:56px;height:56px;border-radius:7px;background:var(--tile);border:1px solid var(--line-2);overflow:hidden;flex:none}
.tile svg{width:78%;height:78%;overflow:visible}
.tile svg>path{stroke:var(--glyph-line);stroke-width:1.6;stroke-linejoin:round}
.tile svg .ln{fill:none;stroke-width:1.4}
.tile img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block}
.tile.big{width:116px;height:116px;cursor:pointer}
.tile-add{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 82%,transparent);font:500 10px/1 var(--f-mono);letter-spacing:.05em;text-align:center;padding:4px 0;color:var(--ink-2);text-transform:uppercase}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid var(--glyph-line);vertical-align:-1px;margin-right:5px}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:7px;font:500 13px var(--f-body);cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.sm{padding:5px 9px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink-2);padding:5px 11px;border-radius:999px;font:500 13px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;font:500 12px/1 var(--f-body);color:var(--ink-2);background:var(--surface-2);padding:5px 8px;border-radius:999px;white-space:nowrap}
.pill svg{width:14px;height:14px}
.pill.act{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* plan summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.sum-row{display:flex;align-items:center;gap:16px}
.big{font:700 64px/.9 var(--f-display);font-stretch:125%;letter-spacing:-.02em;color:var(--accent)}
.sum-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.sum-text strong{font:600 17px/1.25 var(--f-body)}
.gauge{display:flex;gap:3px;margin:16px 0 8px}
.gauge i{flex:1;height:8px;border-radius:2px;background:var(--surface-2)}
.gauge i.on{background:var(--accent)}
.gauge-cap{font-size:13px;color:var(--ink-2)}
.ok{color:var(--ok);font-weight:600}
.warn-text{color:var(--warn);font-weight:600}

/* piece rows */
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.piece{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.piece .meta{min-width:0;display:flex;flex-direction:column;gap:3px}
.piece .nm{font:600 14px/1.25 var(--f-body)}
.piece .sb{font-size:12.5px;color:var(--ink-2)}
.piece .tail{font:500 11px/1.2 var(--f-mono);color:var(--ink-2);text-align:right}
.home{margin-top:12px;font-size:13px;color:var(--ink-2)}
.notes{display:grid;gap:8px;margin-top:12px}
.note{background:var(--warn-soft);color:var(--ink);border-radius:9px;padding:10px 12px;font-size:13.5px}
.note b{color:var(--warn)}

/* rotation matrix */
.scroller{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.matrix{border-collapse:separate;border-spacing:0;min-width:100%}
.matrix th,.matrix td{padding:0;text-align:center;height:34px}
.matrix thead th{font:500 11px var(--f-mono);color:var(--ink-2);min-width:28px;border-bottom:1px solid var(--line-2)}
.matrix tbody th{position:sticky;left:0;background:var(--surface);text-align:left;font:400 12.5px var(--f-body);white-space:nowrap;padding:0 12px 0 12px;min-width:150px;border-right:1px solid var(--line-2);z-index:1}
.matrix thead th:first-child{position:sticky;left:0;background:var(--surface);z-index:2;border-right:1px solid var(--line-2)}
.matrix tbody tr+tr th,.matrix tbody tr+tr td{border-top:1px solid var(--line-2)}
.matrix .c{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line)}
.matrix .c.f{background:var(--accent);border-color:var(--accent)}
.matrix .c.h{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.legend .c{margin-right:5px}
.legend .c{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);vertical-align:-2px}
.legend .c.f{background:var(--accent);border-color:var(--accent)}
.legend .c.h{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}

/* day cards */
.days{display:grid;gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 16px}
.day-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:10px}
.day-head .dn{font:700 17px/1 var(--f-display);font-stretch:112%}
.day-head .dd{font:500 12px var(--f-mono);color:var(--ink-2)}
.day-head .sp{flex:1}
.outfit{display:grid;gap:0;border-top:1px solid var(--line-2)}
.outfit .row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)}
.row .meta{min-width:0;display:flex;flex-direction:column;gap:3px}
.row .nm{font:600 14px/1.25 var(--f-body)}
.row .sb{font-size:12.5px;color:var(--ink-2)}
.row .wear{font:500 11px/1.2 var(--f-mono);color:var(--ink-2);text-align:right;white-space:nowrap}
.why{margin-top:12px;max-width:68ch}
.why .eyebrow{display:block;margin-bottom:5px}
.why p{font-size:14.5px;line-height:1.55}
.gap-day{background:var(--warn-soft);border-color:transparent}

/* forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;min-height:40px}
.inp:focus-visible{outline-offset:0;border-color:var(--accent)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:var(--surface-2);padding:3px;border-radius:9px}
.seg button{border:0;background:transparent;padding:8px 6px;border-radius:7px;font:500 13px var(--f-body);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:max-content}
.stepper button{border:0;background:transparent;width:40px;height:38px;font-size:18px;cursor:pointer;color:var(--ink)}
.stepper output{min-width:36px;text-align:center;font:500 14px var(--f-mono)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.hint{font-size:12.5px;color:var(--ink-2)}
.fday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.fday .fh{display:flex;align-items:baseline;gap:10px}
.fday .fh b{font:700 14px var(--f-display);font-stretch:112%}
.fday .fh span{font:500 12px var(--f-mono);color:var(--ink-2)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fgrid .field>label{font-size:10.5px}
@media(min-width:640px){.fgrid{grid-template-columns:90px 90px 1fr 1.3fr}}
.flist{display:grid;gap:10px}

/* wardrobe */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card.off{opacity:.62}
.card-top{display:flex;gap:14px;align-items:flex-start}
.card-id{display:flex;flex-direction:column;gap:6px;min-width:0;align-items:flex-start}
.card-id h3{font-size:16px}
.facts{display:grid;gap:7px;font-size:13px}
.facts div{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:baseline}
.facts dt{font:500 10.5px/1.4 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.facts dd{margin:0}
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter i{width:14px;height:6px;border-radius:2px;background:var(--surface-2)}
.meter i.on{background:var(--ink-2)}
.card .own{font-size:13.5px;color:var(--ink);border-top:1px solid var(--line-2);padding-top:10px}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border-top:1px solid var(--line-2);padding-top:10px}
.ctl .lab{font-size:13px;color:var(--ink-2)}
.ctl .stepper button{width:34px;height:32px}
.assump{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.assump ul{margin:8px 0 0;padding-left:18px;display:grid;gap:5px;font-size:13.5px;color:var(--ink-2)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--ink-2)}
@media(min-width:760px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}.day-wide{grid-column:1/-1}}
@media(prefers-reduced-motion:no-preference){.tabs button,.btn,.chip{transition:background .12s,border-color .12s}}
</style>
</head><body>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Travel Rotation</h1><span class="trip-line" id="tripLine"></span></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="plan" id="tab-plan">Plan</button>
      <button role="tab" data-tab="trip" id="tab-trip">Trip</button>
      <button role="tab" data-tab="wardrobe" id="tab-wardrobe">Wardrobe</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view" aria-live="polite"></main>

<script id="engine">
/* ================= DATA ================= */
const ACT_ORDER=['city','business','outdoor','transit','relax'];
const ACT_LABEL={city:'City',business:'Business casual',outdoor:'Outdoors',transit:'Travel day',relax:'Relaxed'};
const ACT_SHORT={city:'City',business:'Business',outdoor:'Outdoors',transit:'Travel',relax:'Relaxed'};
const A=(c,b,o,t,r)=>({city:c,business:b,outdoor:o,transit:t,relax:r});

const ITEMS=[
 {id:'t1',code:'T1',kind:'top',glyph:'shirt',role:'shirt',alone:true,name:'Dark green wool shirt',short:'green wool shirt',brand:'Wool & Prince',color:'#2F4A3A',colorName:'dark green',fabric:'Heavy wool (high GSM)',warmth:3.5,form:2,max:4,aff:A(2,1,2,1,1),rewear:'wool airs out overnight',
  note:'High GSM makes it great for colder weather, but as wool it still breathes when it warms up. The dark green limits which pants it matches.'},
 {id:'t2',code:'T2',kind:'top',glyph:'shirt',role:'shirt',alone:true,name:'Light blue wool button-down',short:'light blue wool shirt',brand:'Western Rise',color:'#A9C3DB',colorName:'light blue',fabric:'Wool',warmth:2.0,form:3,max:4,aff:A(2,2,1,1,1),rewear:'wool airs out overnight',
  note:'Versatile and sharp, and it can be worn with shorts too. A shirt for all seasons.'},

/* how well each top's colour sits with each bottom: 3 clean, 2 fine, 1 tonal or muted */
const COMPAT={
 t1:{p1:2,p2:3,p3:2,p4:1,s1:2}, t2:{p1:3,p2:3,p3:3,p4:1,s1:3}, t3:{p1:3,p2:3,p3:2,p4:1,s1:3},
 t4:{p1:3,p2:1,p3:3,p4:3,s1:2}, t5:{p1:3,p2:3,p3:3,p4:3,s1:3}, t6:{p1:3,p2:3,p3:2,p4:1,s1:3},
 t7:{p1:3,p2:1,p3:3,p4:3,s1:1}, t8:{p1:3,p2:3,p3:3,p4:1,s1:3}, t9:{p1:2,p2:3,p3:1,p4:3,s1:1},
 t10:{p1:3,p2:3,p3:2,p4:3,s1:2}
};

/* every way to layer the tops: base first, outermost last */
const PLANS=(()=>{
  const tees=['t5','t6','t7','t8'], shirts=['t1','t2','t3','t4'], knits=['t9','t10'], inner=['t1','t2','t3'];
  const out=[];
  [...tees,...shirts,'t10'].forEach(a=>out.push([a]));
  tees.forEach(b=>shirts.forEach(s=>out.push([b,s])));
  tees.forEach(b=>knits.forEach(k=>out.push([b,k])));
  inner.forEach(s=>knits.forEach(k=>out.push([s,k])));
  tees.forEach(b=>inner.forEach(s=>knits.forEach(k=>out.push([b,s,k]))));
  return out;
})();

/* ================= SCORING ================= */
function evalOutfit(day,plan,b,s){
  const T=(2*day.high+day.low)/3, act=day.act;
  let sc=0, lu=false;
  if(b.id==='s1'){
    if(day.high<22) return null;
    if((day.cond==='rain'||day.cond==='snow')&&day.high<25) return null;
    if(s.id==='f2') return null;
  }else{
    if(day.high>b.maxHigh) return null;
    if(T<b.comfortMin){ if(T<b.luMin) return null; lu=true; sc-=0.7+(b.comfortMin-T)*0.05; }
  }
  if(s.id==='f2'){
    if(day.high>26||act==='outdoor') return null;
    if(T<15) sc+=0.4; else if(T>17) sc-=(T-17)*0.22;
  }
  if((act==='business'||act==='outdoor')&&b.aff[act]===0) return null;
  const parts=plan.map(id=>ITEM[id]);
  let W=parts[0].warmth; for(let i=1;i<parts.length;i++) W+=0.8*parts[i].warmth;
  let D=1.0+Math.max(0,24-T)*0.26-Math.max(0,T-27)*0.08; if(D<0.7) D=0.7;
  if(day.cond==='rain') D+=0.3; else if(day.cond==='snow') D+=0.8;
  const diff=W-D;
  if(diff<-1.3||diff>1.6) return null;
  sc-=diff>0?diff*(T>=24?1.6:0.9):-diff*0.9;
  const rng=day.high-day.low;
  if(parts.length>=2&&rng>=9) sc+=0.4;
  if(parts.length>=2&&T>=22) sc-=0.4;
  if(parts.length===3&&rng<5) sc-=0.4;
  let Fp=Math.max(...parts.map(p=>p.form)); if(parts.length>=2&&parts[0].role==='tee') Fp-=0.4;
  const F=0.4*Fp+0.4*b.form+0.2*s.form;
  const need=act==='business'?2.2:act==='city'?0.6:0;
  if(F<need) return null;
  if(act!=='business'&&act!=='city'&&F>2.3) sc-=(F-2.3)*0.8;
  const ta=parts.reduce((x,p)=>x+p.aff[act],0)/parts.length;
  sc+=(ta-1)*0.9+(b.aff[act]-1)*1.2+(s.aff[act]-1)*0.8;
  const outer=parts[parts.length-1], first=parts[0];
  let c=COMPAT[outer.id][b.id]; if(parts.length>1) c=0.7*c+0.3*COMPAT[first.id][b.id];
  sc+= c>=2.5?0.8 : c>=1.8?0.1 : -0.8;
  const ids=plan.join(' ');
  if(/\bt10\b/.test(ids)&&/\bt(3|6)\b/.test(ids)) sc-=0.8;
  return {score:sc,lu};
}

/* ================= SOLVER ================= */
function solve(cfg){
  const inc=ITEMS.filter(i=>cfg.include[i.id]);
  const n=inc.length, bit={}; inc.forEach((it,k)=>bit[it.id]=k);
  const tops=inc.filter(i=>i.kind==='top'), bots=inc.filter(i=>i.kind==='bottom'), shoes=inc.filter(i=>i.kind==='shoe');
  if(!tops.length||!bots.length||!shoes.length) return {error:'min'};
  const maxArr=inc.map(i=>cfg.max[i.id]);
  const N=cfg.days.length;
  const plans=PLANS.filter(p=>p.every(id=>bit[id]!==undefined));
  const dayOpts=cfg.days.map(day=>{
    const arr=[];
    for(const p of plans) for(const b of bots) for(const s of shoes){
      const r=evalOutfit(day,p,b,s); if(!r) continue;
      const items=[], cost={}; let mask=0;
      p.forEach((id,i)=>{const c=i===0?1:0.5; items.push([bit[id],c]); cost[id]=c; mask|=1<<bit[id];});
      items.push([bit[b.id],1]); cost[b.id]=1; mask|=(1<<bit[b.id])|(1<<bit[s.id]);
      const key=p.join('+')+'|'+b.id;
      arr.push({plan:p,b:b.id,s:s.id,score:r.score,lu:r.lu,items,cost,mask,key,key2:key+'|'+s.id});
    }
    arr.sort((x,y)=>y.score-x.score);
    return arr;
  });
  const bad=[], active=[];
  dayOpts.forEach((o,d)=>o.length?active.push(d):bad.push(d));
  if(!active.length) return {error:'none',bad};
  const wash=(cfg.laundry&&N>=5)?Math.ceil(N/2):N;
  const segs=[active.filter(d=>d<wash),active.filter(d=>d>=wash)].filter(s=>s.length);

  let topM=0,botM=0,shoeM=0,baseCap=[];
  inc.forEach((it,k)=>{ if(it.kind==='top') topM|=1<<k; else if(it.kind==='bottom') botM|=1<<k; else shoeM|=1<<k; });
  const pop=x=>{let c=0;while(x){x&=x-1;c++;}return c;};

  function dfsSeg(seg,opts){
    const order=seg.slice().sort((a,b)=>opts[a].length-opts[b].length);
    const used=new Float32Array(n), chosen={}; let nodes=0;
    const rec=i=>{
      if(i===order.length) return true;
      if(++nodes>400) return false;
      const d=order[i];
      for(const o of opts[d]){
        let ok=true;
        for(const [k,c] of o.items) if(used[k]+c>maxArr[k]+1e-9){ok=false;break;}
        if(!ok) continue;
        for(const [k,c] of o.items) used[k]+=c;
        chosen[d]=o;
        if(rec(i+1)) return true;
        for(const [k,c] of o.items) used[k]-=c;
      }
      return false;
    };
    return rec(0)?chosen:null;
  }
  function feasible(m){
    for(const d of active){ let ok=false; for(const o of dayOpts[d]) if((o.mask&~m)===0){ok=true;break;} if(!ok) return null; }
    for(const seg of segs){
      let capB=0,capT=0;
      for(let k=0;k<n;k++) if(m&(1<<k)){ if(inc[k].kind==='bottom') capB+=maxArr[k]; else if(inc[k].kind==='top'&&inc[k].alone) capT+=maxArr[k]; }
      if(capB<seg.length||capT<seg.length) return null;
    }
    const opts=[]; for(const d of active) opts[d]=dayOpts[d].filter(o=>(o.mask&~m)===0);
    const assign=new Array(N); let score=0;
    for(const seg of segs){ const ch=dfsSeg(seg,opts); if(!ch) return null; for(const d of seg){assign[d]=ch[d]; score+=ch[d].score;} }
    return {assign,score};
  }
  function usageOK(a){
    for(const seg of segs){
      const used=new Float32Array(n);
      for(const d of seg) for(const [k,c] of a[d].items) used[k]+=c;
      for(let k=0;k<n;k++) if(used[k]>maxArr[k]+1e-9) return false;
    }
    return true;
  }
  function objective(a){
    let s=0; const cnt={};
    for(const d of active){ const o=a[d]; s+=o.score; cnt[o.key]=(cnt[o.key]||0)+1; if(cnt[o.key]>1) s-=1.6; }
    for(let i=1;i<N;i++){ const x=a[i-1], y=a[i]; if(x&&y&&x.key2===y.key2) s-=1.0; }
    for(const seg of segs){
      const used=new Float32Array(n);
      for(const d of seg) for(const [k,c] of a[d].items) used[k]+=c;
      for(let k=0;k<n;k++) if(used[k]>0) s-=0.5*Math.pow(used[k]/maxArr[k],2);
    }
    return s;
  }
  function improve(m,start){
    const cur=start.slice(), pool=[];
    active.forEach(d=>pool[d]=dayOpts[d].filter(o=>(o.mask&~m)===0));
    let best=objective(cur);
    for(let pass=0;pass<5;pass++){
      let changed=false;
      for(const d of active){
        const old=cur[d]; let bo=old, bv=best;
        for(const o of pool[d]){
          if(o===old) continue;
          cur[d]=o; if(!usageOK(cur)) continue;
          const v=objective(cur); if(v>bv+1e-9){bv=v;bo=o;}
        }
        cur[d]=bo; if(bo!==old){best=bv;changed=true;}
      }
      if(!changed) break;
    }
    return {assign:cur,obj:best};
  }

  const cand=[];
  for(let m=1;m<(1<<n);m++){
    if(!(m&topM)||!(m&botM)||!(m&shoeM)) continue;
    const ns=pop(m&shoeM); if(ns>2) continue;
    cand.push([pop(m&topM)+pop(m&botM)+0.5*ns,m]);
  }
  cand.sort((x,y)=>x[0]-y[0]||x[1]-y[1]);
  const slack=[0,1,2][cfg.style]||0, lam=[1,0.9,0.45][cfg.style]||1;
  const t0=Date.now(), feas=[]; let minLoad=null;
  for(const [load,m] of cand){
    if(minLoad!==null&&load>minLoad+slack+1e-9) break;
    if(Date.now()-t0>1800) break;
    const r=feasible(m); if(!r) continue;
    if(minLoad===null) minLoad=load;
    feas.push({m,load,r});
    if(feas.length>800) break;
  }
  if(!feas.length) return {error:'wears',bad};
  feas.sort((x,y)=>(y.r.score-lam*(y.load-minLoad))-(x.r.score-lam*(x.load-minLoad)));
  let win=null;
  for(const f of feas.slice(0,8)){
    const imp=improve(f.m,f.r.assign);
    const val=imp.obj-lam*(f.load-minLoad);
    if(!win||val>win.val) win={val,m:f.m,assign:imp.assign,load:f.load};
  }
  /* pack only what the plan actually uses */
  let packMask=0; for(const d of active){ packMask|=win.assign[d].mask; }
  const packed=inc.filter((it,k)=>packMask&(1<<k));
  const P={inc,bit,n,N,segs,wash,bad,active,dayOpts,maxArr,packMask,packed,assign:win.assign,cfg,minLoad,usageOK,
           pieces:packed.filter(i=>i.kind!=='shoe').length};
  P.counts={top:packed.filter(i=>i.kind==='top').length,bottom:packed.filter(i=>i.kind==='bottom').length,shoe:packed.filter(i=>i.kind==='shoe').length};
  wearNumbers(P);
  P.gaps=gapsFor(P);
  return P;
}

function wearNumbers(P){
  P.wearNo=[]; let run={};
  for(let d=0;d<P.N;d++){
    if(d===P.wash) run={};
    const o=P.assign[d]; if(!o) continue;
    const rec={};
    for(const id in o.cost){ run[id]=(run[id]||0)+o.cost[id]; rec[id]={n:Math.ceil(run[id]-1e-9),max:P.cfg.max[id],cost:o.cost[id]}; }
    P.wearNo[d]=rec;
  }
}
function swapDay(P,d){
  const cur=P.assign[d]; if(!cur) return false;
  const alts=P.dayOpts[d].filter(o=>(o.mask&~P.packMask)===0);
  if(alts.length<2) return false;
  const i=alts.findIndex(o=>o.key2===cur.key2);
  for(let step=1;step<alts.length;step++){
    const o=alts[(i+step)%alts.length];
    const trial=P.assign.slice(); trial[d]=o;
    if(P.usageOK(trial)){ P.assign=trial; wearNumbers(P); P.gaps=gapsFor(P); return true; }
  }
  return false;
}
function gapsFor(P){
  const g=[], days=P.cfg.days;
  const lu=P.active.filter(d=>P.assign[d]&&P.assign[d].lu).length;
  const wet=days.filter(d=>d.cond==='rain'||d.cond==='snow').length;
  const cold=days.filter(d=>d.low<=3).length;
  if(lu) g.push({name:'Long underwear',why:`${lu} ${lu===1?'day runs':'days run'} cooler than your pants are rated for on their own. One thin pair covers it.`});
  if(wet) g.push({name:'Packable rain shell',why:`${wet} wet ${wet===1?'day':'days'} in the forecast, and nothing in the wardrobe is a waterproof outer layer.`});
  if(cold) g.push({name:'Hat and gloves',why:`Lows reach freezing or close to it on ${cold} ${cold===1?'day':'days'}.`});
  return g;
}

/* ================= WORDS ================= */
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function explain(P,d,fmt){
  const day=P.cfg.days[d], o=P.assign[d], wn=P.wearNo[d];
  const parts=o.plan.map(id=>ITEM[id]), b=ITEM[o.b];
  const hi=fmt(day.high), lo=fmt(day.low), rng=day.high-day.low;
  const outer=parts[parts.length-1], inner=parts[0];
  const out=[];
  if(parts.length>=2){
    out.push(rng>=8
      ? `The ${outer.short} goes over the ${inner.short}, so you can peel down between ${lo} mornings and ${hi} afternoons.`
      : `The ${outer.short} over the ${inner.short} adds the warmth that a high of ${hi} and a low of ${lo} call for.`);
  }else if(day.high>=22){
    out.push(`The ${outer.short} stays light and breathable at ${hi}.`);
  }else{
    out.push(`The ${outer.short} is the right weight for a high of ${hi} and a low of ${lo}.`);
  }
  if(o.lu) out.push(`It is cooler than the ${b.short} suit on their own, so wear a thin layer of long underwear underneath.`);
  const actLine={
    city:'Comfortable on foot all day and neat enough for a café or restaurant stop.',
    business:'Dressed enough for a business-casual dinner or meeting.',
    outdoor:'Built for time outside, with pockets and fabric that dries fast.',
    transit:'Easy to sit in for hours, with pockets close at hand for passport and phone.',
    relax:'Relaxed and easy for a slow day.'
  }[day.act];
  out.push(`${actLine} ${b.perk?b.perk+'.':''}`.trim());
  if(day.cond==='rain'||day.cond==='snow') out.push('The forecast is wet, so keep the rain shell handy.');
  let c=COMPAT[outer.id][b.id];
  out.push(c>=3?`${cap(outer.colorName)} on ${b.colorName} is a clean pairing.`:c===2?`${cap(outer.colorName)} and ${b.colorName} sit well together.`:`${cap(outer.colorName)} and ${b.colorName} make a quiet, tonal pairing.`);
  let best=null;
  for(const id in wn){ const w=wn[id]; if(w.cost===1&&w.n>=2&&ITEM[id].rewear&&ITEM[id].kind!=='shoe'&&(!best||w.n>best.n)) best={id,...w}; }
  if(best) out.push(`Wear ${best.n} of ${best.max} for the ${ITEM[best.id].short}: ${ITEM[best.id].rewear}.`);
  return out.join(' ');
}
</script>

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);

const photoOf=id=>photos[id]||PHOTO_SRC[id]||null;
const imgHTML=it=>`<img src="${photoOf(it.id)}" alt="${esc(it.name)}" data-id="${it.id}" decoding="async">`;

/* ================= COMPUTE ================= */
function cfg(){

function recompute(){

}

function pieceRow(it,tail){

function renderPlan(){

  const head=`<tr><th scope="col" style="text-align:left;padding-left:12px">Piece</th>${Array.from({length:n},(_,d)=>`<th scope="col">${d+1}</th>`).join('')}</tr>`;

  }).join('')}</tr>`).join('');
  const matrix=`<div class="scroller"><table class="matrix"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
    <div class="legend"><span><i class="c f"></i>Worn against skin or alone</span><span><i class="c h"></i>Worn as a layer</span><span>${P.wash<n?`Wash after day ${P.wash}`:'No wash planned'}</span></div>`;

    if(!o){

      return `<article class="day gap-day">${head}<p><b>Gap.</b> ${why}</p></article>`;
    }

    <section><div class="sub-head"><h2>Rotation</h2><span class="eyebrow">Days across</span></div>${matrix}</section>
    <section><div class="sub-head"><h2>Day by day</h2></div><div class="days">${days}</div></section>`;
}

function renderTrip(){
  const t=state.trip, U=state.unit, n=t.days.length;
  const opt=(v,l,sel)=>`<option value="${v}"${sel?' selected':''}>${l}</option>`;
  const dayRows=t.days.map((d,i)=>`<div class="fday"><div class="fh"><b>Day ${i+1}</b><span>${fmtD(dayDate(i),{weekday:'short',day:'numeric',month:'short'})}</span></div>

    </div></div>`).join('');
  return `<div class="sec-head"><h2>Trip</h2><p class="muted" id="liveSummary">${esc(liveText())}</p></div>
  <section class="panel">
    <div class="two">
      <div class="field"><label for="dest">Destination</label><input class="inp" id="dest" value="${esc(t.dest)}" autocomplete="off"></div>
      <div class="field"><label for="start">First day</label><input class="inp" id="start" type="date" value="${esc(t.start)}"></div>
    </div>
    <div class="two">
      <div class="field"><span class="lbl">Days away</span><div class="stepper"><button data-act="days" data-v="-1" aria-label="One fewer day">−</button><output>${n}</output><button data-act="days" data-v="1" aria-label="One more day">+</button></div></div>
      <div class="field"><label for="type">Type of trip</label><select class="inp" id="type">${Object.keys(TYPES).map(k=>opt(k,TYPES[k],t.type===k)).join('')}</select><span class="hint">Changing this resets each day's plans below.</span></div>
    </div>
  </section>
  <section class="panel">
    <div class="field"><span class="lbl">Packing style</span>
      <div class="seg" role="group" aria-label="Packing style">${['Lightest','Balanced','More variety'].map((l,i)=>`<button data-act="style" data-v="${i}" aria-pressed="${t.style===i}">${l}</button>`).join('')}</div>
      <span class="hint">Lightest packs the fewest pieces that cover every day. The others add one or two pieces for more outfit variety.</span></div>
    <label class="check"><input type="checkbox" id="laundry"${t.laundry?' checked':''}><span><b>Wash once mid-trip</b><br><span class="hint">A sink wash or laundry stop resets every wear count halfway through. It only applies to trips of five days or more.</span></span></label>
    <div class="field"><span class="lbl">Temperature</span><div class="seg" role="group" aria-label="Temperature unit" style="max-width:180px">${['C','F'].map(u=>`<button data-act="unit" data-v="${u}" aria-pressed="${U===u}">°${u}</button>`).join('')}</div></div>
  </section>
  <section>
    <div class="sub-head"><h2>Forecast and plans</h2></div>
    <p class="hint" style="margin-bottom:12px">Enter the forecast for your dates. The planner reads each day's high, low, sky and what you plan to do.</p>
    <div class="field" style="margin-bottom:12px;max-width:340px"><label for="preset">Fill every day from a climate</label><select class="inp" id="preset"><option value="">Choose a climate…</option>${Object.keys(PRESETS).map(k=>`<option value="${k}">${PRESETS[k].label}</option>`).join('')}</select></div>
    <div class="flist">${dayRows}</div>
  </section>`;
}

function renderWardrobe(){
  const U=state.unit;
  const list=ITEMS.filter(i=>filter==='all'||i.kind===filter);
  const on=ITEMS.filter(i=>state.items[i.id].on).length;
  const f=[['all','All'],['top','Tops'],['bottom','Pants and shorts'],['shoe','Shoes']];
  const card=it=>{
    const st=state.items[it.id];
    const best=ACT_ORDER.filter(a=>it.aff[a]===2).map(a=>ACT_SHORT[a]);
    let fact='';
    if(it.kind==='top'){ const lv=Math.max(1,Math.min(5,Math.round(it.warmth*1.4))); fact=`<div><dt>Warmth</dt><dd><span class="meter" title="${lv} of 5">${[1,2,3,4,5].map(i=>`<i class="${i<=lv?'on':''}"></i>`).join('')}</span></dd></div>`; }
    else if(it.id==='s1') fact=`<div><dt>Best</dt><dd>${fmtT(22)} and up, dry days</dd></div>`;
    else if(it.kind==='bottom') fact=`<div><dt>Comfort</dt><dd>${fmtT(it.comfortMin)} to ${fmtT(it.maxHigh)}, down to ${fmtT(it.luMin)} with long underwear</dd></div>`;
    else if(it.id==='f2') fact=`<div><dt>Best</dt><dd>Under ${fmtT(26)}, never with shorts</dd></div>`;
    else fact=`<div><dt>Best</dt><dd>Any weather, any pants or shorts</dd></div>`;
    const stepper=it.kind==='shoe'?'':`<span class="lab">Wears between washes</span><span class="stepper"><button data-act="wears" data-id="${it.id}" data-v="-1" aria-label="Fewer wears for ${esc(it.name)}">−</button><output>${st.max}</output><button data-act="wears" data-id="${it.id}" data-v="1" aria-label="More wears for ${esc(it.name)}">+</button></span>`;
    return `<article class="card ${st.on?'':'off'}">
      <div class="card-top">
        <label class="tile big" title="Add a photo of ${esc(it.name)}"><input class="vh" type="file" accept="image/*" data-photo="${it.id}">${photoOf(it.id)?imgHTML(it):glyph(it)}<span class="tile-add">${photoOf(it.id)?'Change':'+ Photo'}</span></label>
        <div class="card-id"><span class="code">${it.code}</span><h3>${esc(it.name)}</h3><p class="small muted">${it.brand?esc(it.brand)+' · ':''}<i class="sw" style="background:${it.color}"></i>${esc(it.colorName)}</p></div>
      </div>
      <dl class="facts" style="margin:0">
        <div><dt>Best for</dt><dd>${best.length?best.join(', '):'General use'}</dd></div>
        ${it.fabric?`<div><dt>Fabric</dt><dd>${esc(it.fabric)}</dd></div>`:''}
        ${fact}
      </dl>
      <p class="own">${esc(it.note)}</p>
      <div class="ctl">
        <label class="check" style="align-items:center"><input type="checkbox" data-act="on" data-id="${it.id}"${st.on?' checked':''}><span>Take on trips</span></label>
        ${stepper}
      </div></article>`;
  };
  return `<div class="sec-head"><h2>Wardrobe</h2><p class="muted">${plural(ITEMS.length,'piece')}, ${on} available for trips. Tap a photo to replace it.</p></div>
    <div class="chips" role="group" aria-label="Filter">${f.map(([k,l])=>`<button class="chip" data-act="filter" data-v="${k}" aria-pressed="${filter===k}">${l}</button>`).join('')}</div>
    <div class="grid">${list.map(card).join('')}</div>
    <section class="assump"><h3>How the planner reads these pieces</h3>
      <ul>
        <li>Warmth and comfort ranges are estimates from your descriptions and the fabrics. Everything else comes from your notes above.</li>
        <li>Wears between washes starts at 2 for cotton tees, 3 for merino and technical tops, 4 for most pants and 6 for the merino sweater. Change any of them with the buttons.</li>
        <li>A piece worn as an outer layer counts as half a wear, since it stays off your skin.</li>
        <li>Photos you add or replace here stay in this browser only.</li>
      </ul></section>`;
}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const tabBtn=e.target.closest('[data-tab]'); if(tabBtn){ state.tab=tabBtn.dataset.tab; save(); render(); window.scrollTo(0,0); return; }
  const b=e.target.closest('[data-act]'); if(!b||b.tagName==='INPUT'&&b.type==='checkbox') return;
  const act=b.dataset.act, v=b.dataset.v;
  if(act==='swap'){ if(PLAN&&!PLAN.error){ const d=+b.dataset.d; const y=window.scrollY; if(!swapDay(PLAN,d)) b.textContent='No other outfit fits'; else {render(); window.scrollTo(0,y);} } }
  else if(act==='days'){
    const t=state.trip, n=t.days.length, m=Math.max(2,Math.min(14,n+(+v)));
    if(m>n){ const last=t.days[n-1], acts=defaultActs(t.type,m); if(n>1&&last.act==='transit') last.act=acts[n-1]; for(let i=n;i<m;i++) t.days.push({high:last.high,low:last.low,cond:last.cond,act:acts[i]}); }
    else if(m<n) t.days.length=m;
    if(m!==n){ t.days[m-1].act='transit'; t.days[0].act='transit'; touch(); render(); }
  }
  else if(act==='style'){ state.trip.style=+v; touch(); render(); }
  else if(act==='unit'){ state.unit=v; save(); render(); }
  else if(act==='filter'){ filter=v; render(); }
  else if(act==='wears'){ const s=state.items[b.dataset.id]; s.max=Math.max(1,Math.min(9,s.max+(+v))); touch(); render(); }
});
document.addEventListener('change',e=>{
  const t=e.target, S=state.trip;
  if(t.dataset&&t.dataset.photo){ const f=t.files&&t.files[0]; if(f) readPhoto(t.dataset.photo,f); return; }
  if(t.dataset&&t.dataset.act==='on'){ state.items[t.dataset.id].on=t.checked; touch(); render(); return; }
  if(t.id==='dest'){ S.dest=t.value.trim(); touch(); }
  else if(t.id==='start'){ if(t.value) S.start=t.value; touch(); render(); }
  else if(t.id==='type'){ S.type=t.value; const a=defaultActs(S.type,S.days.length); S.days.forEach((d,i)=>d.act=a[i]); touch(); render(); }
  else if(t.id==='laundry'){ S.laundry=t.checked; touch(); }
  else if(t.id==='preset'){ const p=PRESETS[t.value]; if(!p) return; S.days.forEach((d,i)=>{ d.high=p.hi+WAVE[i%10]; d.low=p.lo+WAVE[(i+3)%10]; if(d.low>=d.high) d.low=d.high-3; d.cond=p.conds[i%p.conds.length]; }); touch(); render(); }
  else if(t.dataset&&t.dataset.f){
    const d=S.days[+t.dataset.d]; if(!d) return; const f=t.dataset.f;
    if(f==='high'||f==='low'){
      const v=parseFloat(t.value); if(!isFinite(v)){ t.value=fromC(d[f]); return; }
      d[f]=toC(v);
      if(d.low>d.high){ if(f==='high') d.low=d.high; else d.high=d.low; const row=t.closest('.fgrid'); row.querySelector('[data-f="high"]').value=fromC(d.high); row.querySelector('[data-f="low"]').value=fromC(d.low); }
    }else d[f]=t.value;
    touch();
  }
});
function readPhoto(id,file){
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const s=Math.min(1,420/Math.max(img.width,img.height)), c=document.createElement('canvas');
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    photos[id]=c.toDataURL('image/jpeg',0.8); savePhotos(); render();
  }; img.src=r.result; };
  r.readAsDataURL(file);
}

document.addEventListener('error',e=>{
  const im=e.target; if(!im||im.tagName!=='IMG'||!im.dataset.id) return;
  const it=ITEM[im.dataset.id]; if(it) im.outerHTML=glyph(it);
},true);

render();
</script>

</body></html>
